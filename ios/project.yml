name: Remember
options:
  bundleIdPrefix: com.example.remember
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    REMEMBER_BUNDLE_ID: com.example.remember
    REMEMBER_APP_GROUP: group.com.example.remember.shared
    REMEMBER_DEVELOPMENT_TEAM: ""
    REMEMBER_API_URL: http://127.0.0.1:8787
    REMEMBER_APP_CODE_SIGN_STYLE: Automatic
    REMEMBER_SHARE_CODE_SIGN_STYLE: Automatic
    REMEMBER_APP_PROFILE_SPECIFIER: ""
    REMEMBER_SHARE_PROFILE_SPECIFIER: ""
    DEVELOPMENT_TEAM: $(REMEMBER_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 26
    MARKETING_VERSION: 1.0
targets:
  Remember:
    type: application
    platform: iOS
    sources:
      - path: Remember
      - path: Shared
    resources:
      - path: Remember/Resources
    entitlements:
      path: Remember/Remember.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(REMEMBER_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID)
        PRODUCT_NAME: Remember
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Remember/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: $(REMEMBER_APP_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(REMEMBER_APP_PROFILE_SPECIFIER)
    dependencies:
      - target: RememberShare
        embed: true
      - target: RememberFocusMonitor
        embed: true
  RememberShare:
    type: app-extension
    platform: iOS
    sources:
      - path: RememberShare
      - path: Shared
    entitlements:
      path: RememberShare/RememberShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(REMEMBER_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID).share
        PRODUCT_NAME: Remember Share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RememberShare/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: $(REMEMBER_SHARE_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(REMEMBER_SHARE_PROFILE_SPECIFIER)
  RememberFocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: RememberFocusMonitor
        excludes: [Info.plist]
    entitlements:
      path: RememberFocusMonitor/RememberFocusMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID).focus-monitor
        PRODUCT_NAME: RememberFocusMonitor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RememberFocusMonitor/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: $(REMEMBER_SHARE_CODE_SIGN_STYLE)
  RememberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RememberTests
    dependencies:
      - target: Remember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  RememberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RememberUITests
    dependencies:
      - target: Remember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Remember:
    build:
      targets:
        Remember: all
        RememberShare: all
        RememberTests: [test]
        RememberUITests: [test]
    test:
      targets:
        - RememberTests
        - RememberUITests
      gatherCoverageData: true
