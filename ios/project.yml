name: Remember
options:
  bundleIdPrefix: com.example.remember
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    REMEMBER_BUNDLE_ID: com.example.remember
    REMEMBER_APP_GROUP: group.com.example.remember.shared
    REMEMBER_DEVELOPMENT_TEAM: ""
    DEVELOPMENT_TEAM: $(REMEMBER_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.0
targets:
  Remember:
    type: application
    platform: iOS
    sources:
      - path: Remember
      - path: Shared
    resources:
      - path: Remember/Resources
    entitlements:
      path: Remember/Remember.entitlements
      properties:
        com.apple.security.application-groups:
          - $(REMEMBER_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID)
        PRODUCT_NAME: Remember
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Remember
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_RememberAppGroup: $(REMEMBER_APP_GROUP)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: RememberShare
        embed: true
  RememberShare:
    type: app-extension
    platform: iOS
    sources:
      - path: RememberShare
      - path: Shared
    entitlements:
      path: RememberShare/RememberShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(REMEMBER_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID).share
        PRODUCT_NAME: Remember Share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RememberShare/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
  RememberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RememberTests
    dependencies:
      - target: Remember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  RememberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RememberUITests
    dependencies:
      - target: Remember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMEMBER_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Remember:
    build:
      targets:
        Remember: all
        RememberShare: all
        RememberTests: [test]
        RememberUITests: [test]
    test:
      targets:
        - RememberTests
        - RememberUITests
      gatherCoverageData: true
